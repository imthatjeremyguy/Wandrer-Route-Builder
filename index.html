<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wandrer Route Builder</title>
  <meta name="description" content="Build bike loops that maximize new Wandrer roads.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="layout">
    <aside class="panel" aria-label="Route builder controls">
      <header class="sign">
        <h1>Wandrer Route Builder</h1>
        <p class="sign-sub">More new road, fewer repeat miles</p>
      </header>

      <section class="step" id="step-map">
        <h2>Your Wandrer map</h2>

        <div id="empty-state">
          <p>Upload the KMZ export from the Wandrer Big Map: Download, then KML/KMZ, Bike.</p>
          <label class="btn" for="kmz-input">Upload KMZ</label>
        </div>

        <div id="loaded-state" hidden>
          <div class="readout" aria-live="polite">
            <span class="readout-num" id="stat-miles">0.00</span>
            <span class="readout-unit">mi untraveled</span>
          </div>
          <dl class="facts">
            <div><dt>Road pieces</dt><dd id="stat-pieces">0</dd></div>
            <div><dt>Exported</dt><dd id="stat-date">-</dd></div>
          </dl>
          <label class="btn btn-quiet" for="kmz-input">Replace KMZ</label>
        </div>

        <input type="file" id="kmz-input" accept=".kmz,.kml" hidden>
        <p class="msg" id="msg" role="status"></p>
      </section>

      <footer class="panel-foot">
        <p>Your KMZ stays in this browser. Nothing is uploaded.</p>
      </footer>
    </aside>

    <div id="map" aria-label="Map of untraveled roads"></div>
    <div class="drop-hint" id="drop-hint" hidden>Drop your KMZ to load it</div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/kmz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
