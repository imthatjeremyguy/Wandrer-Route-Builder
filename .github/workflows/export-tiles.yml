# Temporary: copy a few road tiles to the test-tiles branch for offline solver testing.
name: Export test tiles
on:
  workflow_dispatch:
    inputs:
      tiles:
        description: "Space-separated tile names, e.g. -861_397 -860_397"
        required: true
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: month
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        with:
          path: data/roads
          key: roads-indiana-${{ steps.month.outputs.ym }}-${{ hashFiles('tools/build_roads.py') }}
          fail-on-cache-miss: true
      - name: Push tiles to test-tiles
        env:
          TILES: ${{ inputs.tiles }}
        run: |
          mkdir out
          for t in $TILES; do cp "data/roads/$t.json" out/ || true; done
          cp data/roads/index.json out/ || true
          cd out && git init -q -b test-tiles && git add . \
            && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm tiles \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-tiles
